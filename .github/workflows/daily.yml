name: NadiaAI Daily Pipeline

on:
  schedule:
    # 07:00 UTC = 08:00 CET / 09:00 CEST (main daily run)
    # Note: during DST (last Sunday of March → last Sunday of October),
    # this runs at 09:00 local. Acceptable for a morning summary.
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: self-hosted   # TEMP: route to the self-hosted runner for a one-off test (revert to ubuntu-latest after)
    # The worklist email sends at the end of the pipeline (Step 8b), so the run
    # must be allowed to complete a full scrape+merge+export before delivery.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline
        env:
          # Delivery is the self-hosted dashboard (reads the DB the cron commits).
          # Two LLMs, one job each — both graceful if unset:
          #   EXTRACTION_*  → text→JSON extraction (MiniMax M3 via OpenRouter)
          #   PERPLEXITY_API_KEY → search-native contact discovery (Sonar)
          # KEYS come from GitHub Secrets; URL/MODEL are plain config (not secret).
          # CONTACT_ENRICH_MAX_PER_RUN caps search spend per run.
          EXTRACTION_API_KEY: ${{ secrets.EXTRACTION_API_KEY }}
          EXTRACTION_API_URL: https://openrouter.ai/api/v1/chat/completions
          EXTRACTION_MODEL: minimax/minimax-m3
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Email the daily A/B worklist (.xlsx) to Nadia. All three must be set
          # for the email to send; if any is missing the step skips silently.
          # SMTP_PASSWORD must be a Gmail *app password* (2FA), not the account password.
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAMA_EMAIL: ${{ secrets.MAMA_EMAIL }}
          # Optional: route boe.es through a residential/Spain proxy to dodge the
          # datacenter-IP block. Unset = direct connection (no-op).
          BOE_PROXY_URL: ${{ secrets.BOE_PROXY_URL }}
        run: python -m nadia_ai --cron

  on-failure:
    needs: run-pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure — ${new Date().toISOString().split('T')[0]}`;
            const body = `The daily NadiaAI pipeline failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'pipeline'],
            });
