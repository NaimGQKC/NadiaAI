name: NadiaAI Daily Pipeline

on:
  schedule:
    # 07:00 UTC = 08:00 CET / 09:00 CEST (main daily run)
    # Note: during DST (last Sunday of March → last Sunday of October),
    # this runs at 09:00 local. Acceptable for a morning summary.
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline
        env:
          # Delivery is now the self-hosted dashboard (reads the DB the cron commits);
          # Google Sheets + Gmail were discontinued. ANTHROPIC_API_KEY powers heir/
          # address extraction in CI (no Ollama on the runner). Optional: set
          # NADIA_ANTHROPIC_MODEL to claude-haiku-4-5 to cut extraction cost ~5x.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PERPLEXITY_API_KEY powers search-native contact discovery (Sonar). Optional:
          # skipped gracefully if unset. CONTACT_ENRICH_MAX_PER_RUN caps cost per run.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python -m nadia_ai --cron

  on-failure:
    needs: run-pipeline
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure — ${new Date().toISOString().split('T')[0]}`;
            const body = `The daily NadiaAI pipeline failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'pipeline'],
            });
