name: Export leads (Excel for client)

# Dumps the Aragón (or any-CCAA) heir leads to a formatted Excel workbook and uploads
# it as a downloadable artifact. Self-hosted (needs the persistent DB). Read-only:
# never mutates the DB or spends any credits.

on:
  workflow_dispatch:
    inputs:
      ccaa:
        description: 'CCAA scope (e.g. "aragon"); blank = all'
        required: false
        default: "aragon"
      tiers:
        description: "Tiers to include (comma list)"
        required: false
        default: "A,B"
      emailed_only:
        description: '"1" = only rows with an email; "0" = full A/B list'
        required: false
        default: "0"
      conf:
        description: '"high" = only high-confidence emails; blank = high+medium'
        required: false
        default: ""

jobs:
  export:
    runs-on: [self-hosted, nadia]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install -e .
          pip install openpyxl

      - name: DB coverage stats (read-only, to log)
        shell: powershell
        run: |
          $env:NADIA_DB_PATH = "$env:USERPROFILE\nadia-ai-data\nadia_ai.db"
          python tools/db_stats.py

      - name: Export leads to Excel
        shell: powershell
        env:
          HEIR_EXPORT_CCAA: ${{ inputs.ccaa }}
          HEIR_EXPORT_TIERS: ${{ inputs.tiers }}
          HEIR_EXPORT_EMAILED_ONLY: ${{ inputs.emailed_only }}
          HEIR_EXPORT_CONF: ${{ inputs.conf }}
        run: |
          $env:NADIA_DB_PATH = "$env:USERPROFILE\nadia-ai-data\nadia_ai.db"
          $env:HEIR_EXPORT_OUT = "$env:GITHUB_WORKSPACE\nadia_leads_export.xlsx"
          Write-Host "Using persistent DB at $env:NADIA_DB_PATH"
          python tools/export_leads.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nadia-leads-excel
          path: |
            nadia_leads_export.xlsx
            nadia_leads_export.csv
          if-no-files-found: error
