name: Test heir-phone coverage (self-hosted, on-demand)

# One-off empirical test: for a sample of REAL heirs in the persistent DB, ask a
# people-enrichment provider whether it has a phone for them. On a free PDL key the
# value is masked to a boolean, which still tells us the COVERAGE CEILING (how many
# heirs a paid key could return a number for) — the go/no-go signal for paying.
#
# Runs on PEDRO (needs the persistent DB). Trigger manually from the Actions tab.
# The API key is passed as a dispatch input (ephemeral) so no secret is required.

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "Provider API key (e.g. People Data Labs). Reroll it after the test."
        required: true
      sample:
        description: "How many heirs to test"
        required: false
        default: "50"
      provider:
        description: "Provider id (pdl)"
        required: false
        default: "pdl"

jobs:
  test-heir-phones:
    runs-on: [self-hosted, nadia]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -e .

      - name: Run heir-phone coverage test
        shell: powershell
        env:
          HEIR_TEST_KEY: ${{ inputs.api_key }}
          HEIR_TEST_SAMPLE: ${{ inputs.sample }}
          HEIR_TEST_PROVIDER: ${{ inputs.provider }}
        run: |
          # Same persistent DB the daily pipeline uses.
          $env:NADIA_DB_PATH = "$env:USERPROFILE\nadia-ai-data\nadia_ai.db"
          Write-Host "Using persistent DB at $env:NADIA_DB_PATH"
          python tools/test_heir_phones.py
