name: Aragón full re-run (re-extract + enrich)

# Force-re-extracts Aragón leads with the LLM (applying the accent + surname fixes),
# then enriches their emails via PDL. Narrates progress to the job log. Self-hosted
# (needs the persistent DB + a Spanish IP to re-fetch source documents).
#
# Trigger manually. Set `dry` = "1" first to see the plan/counts with no changes.

on:
  workflow_dispatch:
    inputs:
      enrich:
        description: '"1" = re-extract + PDL email enrichment (spends credits); "0" = re-extract ONLY (0 credits)'
        required: false
        default: "0"
      pdl_key:
        description: "PDL API key (only needed when enrich=1). Reroll after."
        required: false
        default: ""
      dry:
        description: '"1" = dry run (counts only, no reset/extract/spend); "0" = live'
        required: false
        default: "1"
      sample:
        description: "Max Aragón heirs to email-enrich"
        required: false
        default: "60"

jobs:
  aragon-full:
    runs-on: [self-hosted, nadia]
    timeout-minutes: 120   # LLM re-extraction of the Aragón cohort can take a while

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -e .

      - name: Aragón re-extract + enrich
        shell: powershell
        env:
          # Extraction LLM (same as the daily pipeline)
          EXTRACTION_API_KEY: ${{ secrets.EXTRACTION_API_KEY }}
          EXTRACTION_API_URL: https://openrouter.ai/api/v1/chat/completions
          EXTRACTION_MODEL: deepseek/deepseek-chat
          # PDL for email enrichment (Phase 3)
          HEIR_TEST_KEY: ${{ inputs.pdl_key }}
          HEIR_TEST_SAMPLE: ${{ inputs.sample }}
          ARAGON_DRY: ${{ inputs.dry }}
          ARAGON_ENRICH: ${{ inputs.enrich }}
          # Optional proxy (unused on a Spanish IP, kept for parity)
          BOE_PROXY_URL: ${{ secrets.BOE_PROXY_URL }}
        run: |
          $env:NADIA_DB_PATH = "$env:USERPROFILE\nadia-ai-data\nadia_ai.db"
          Write-Host "Using persistent DB at $env:NADIA_DB_PATH"
          python tools/aragon_full_run.py
